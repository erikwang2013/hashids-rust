version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # dtolnay/rust-toolchain@1.85 / @1.94 是 MSRV 钉版（语义化 Rust 版本），
      # 不是 action 版本，不随 dependabot 升级。
      - dependency-name: "dtolnay/rust-toolchain"
