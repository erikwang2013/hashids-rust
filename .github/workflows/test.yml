name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy（全部 feature，告警即失败）
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Check（逐个 feature：单适配器可独立编译）
        run: |
          for f in axum actix rocket poem salvo warp bee ecat; do
            echo "::group::feature $f"
            cargo check --no-default-features --features "$f"
            echo "::endgroup::"
          done

      - name: Test（全部 feature：官方向量 + 八框架集成 + doctest）
        run: cargo test --all-features

      - name: Test（默认 feature：零依赖内核）
        run: cargo test --no-default-features

  msrv:
    name: MSRV 1.85（零依赖内核）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust 1.85
        uses: dtolnay/rust-toolchain@1.120

      - uses: Swatinem/rust-cache@v2

      - name: Check 零依赖内核
        run: cargo check --no-default-features

  msrv-all-features:
    name: MSRV 1.94（--all-features）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust 1.94
        uses: dtolnay/rust-toolchain@1.120

      - uses: Swatinem/rust-cache@v2

      - name: Check 全部 feature（以 Salvo 的 MSRV 为准）
        run: cargo check --all-features
