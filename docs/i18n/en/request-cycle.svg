<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 612" role="img" aria-labelledby="reqTitle reqDesc">
  <title id="reqTitle">erikwang2013/hashids-rust request cycle</title>
  <desc id="reqDesc">From request arrival to response: the default connection is resolved once at wiring time; at runtime each request only clones a Guard and encodes/decodes. Fails fast when the default connection is unset.</desc>

  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "PingFang SC", "Microsoft YaHei", monospace; }
      .bg        { fill: #ffffff; }
      .card      { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .c-mask    { fill: #ffffff; }
      .c-frontend { fill: rgba(34,211,238,.15);  stroke: #0891b2; stroke-width: 1.5; }
      .c-backend  { fill: rgba(52,211,153,.18);  stroke: #059669; stroke-width: 1.5; }
      .c-cloud    { fill: rgba(251,191,36,.18);  stroke: #d97706; stroke-width: 1.5; }
      .c-database { fill: rgba(167,139,250,.18); stroke: #7c3aed; stroke-width: 1.5; }
      .c-security { fill: rgba(244,63,94,.14);   stroke: #e11d48; stroke-width: 1.5; }
      .t-primary { fill: #0f172a; font-weight: 600; }
      .t-muted   { fill: #475569; }
      .t-dim     { fill: #94a3b8; }
      .t-frontend   { fill: #0891b2; font-weight: 600; }
      .t-backend    { fill: #059669; font-weight: 600; }
      .t-cloud      { fill: #d97706; font-weight: 600; }
      .t-database   { fill: #7c3aed; font-weight: 600; }
      .t-security   { fill: #e11d48; font-weight: 600; }
      .a-default { stroke: #94a3b8; fill: none; }
      .a-head    { fill: #94a3b8; }

      @media (prefers-color-scheme: dark) {
        .bg        { fill: #0b1220; }
        .card      { fill: #0f172a; stroke: #1e293b; }
        .c-mask    { fill: #0f172a; }
        .c-frontend { fill: rgba(8,51,68,.40);   stroke: #22d3ee; }
        .c-backend  { fill: rgba(6,78,59,.40);   stroke: #34d399; }
        .c-cloud    { fill: rgba(120,53,15,.35); stroke: #fbbf24; }
        .c-database { fill: rgba(76,29,149,.40); stroke: #a78bfa; }
        .c-security { fill: rgba(76,5,25,.40);   stroke: #fb7185; }
        .t-primary { fill: #f8fafc; }
        .t-muted   { fill: #94a3b8; }
        .t-dim     { fill: #64748b; }
        .t-frontend   { fill: #22d3ee; }
        .t-backend    { fill: #34d399; }
        .t-cloud      { fill: #fbbf24; }
        .t-database   { fill: #a78bfa; }
        .t-security   { fill: #fb7185; }
        .a-default { stroke: #64748b; }
        .a-head    { fill: #64748b; }
      }
    </style>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="a-head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="612"/>
  <!-- Project mascot “Hashy” icon -->
  <g transform="translate(1024, 14)">
    <defs><linearGradient id="mascotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient></defs>
    <line x1="17" y1="8" x2="17" y2="2" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="17" cy="0" r="3.5" fill="#0891b2"/>
    <rect x="0" y="10" width="34" height="42" rx="13" fill="url(#mascotGrad)" stroke="rgba(15,23,42,.08)" stroke-width="1"/>
    <ellipse cx="11" cy="25" rx="4.4" ry="4.8" fill="#ffffff"/>
    <ellipse cx="23" cy="25" rx="4.4" ry="4.8" fill="#ffffff"/>
    <circle cx="11.8" cy="26" r="2.2" fill="#0f172a"/>
    <circle cx="23.8" cy="26" r="2.2" fill="#0f172a"/>
    <text x="17" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="rgba(15,23,42,.78)">#</text>
  </g>

  <text x="24" y="40" class="t-primary" font-size="20">Request Cycle</text>
  <text x="24" y="62" class="t-muted" font-size="11">The default connection is resolved once at wiring time; each runtime request only clones a Guard and encodes/decodes</text>

  <!-- request flow arrows -->
  <line class="a-default" x1="228" y1="202" x2="248" y2="202" stroke-width="1.5" marker-end="url(#ah)"/>
  <line class="a-default" x1="428" y1="202" x2="448" y2="202" stroke-width="1.5" marker-end="url(#ah)"/>
  <line class="a-default" x1="628" y1="202" x2="648" y2="202" stroke-width="1.5" marker-end="url(#ah)"/>
  <line class="a-default" x1="828" y1="202" x2="848" y2="202" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- stage 1 -->
  <rect class="c-mask"     x="52" y="140" width="176" height="124" rx="10"/>
  <rect class="c-frontend" x="52" y="140" width="176" height="124" rx="10"/>
  <text class="t-primary" x="140" y="182" font-size="12" text-anchor="middle">Request arrives</text>
  <text class="t-muted"   x="140" y="208" font-size="9"  text-anchor="middle">GET /user · route matched</text>
  <text class="t-dim"     x="140" y="232" font-size="8"  text-anchor="middle">framework's own entry</text>

  <!-- stage 2 -->
  <rect class="c-mask"    x="252" y="140" width="176" height="124" rx="10"/>
  <rect class="c-backend" x="252" y="140" width="176" height="124" rx="10"/>
  <text class="t-primary" x="340" y="182" font-size="12" text-anchor="middle">Fetch the Guard</text>
  <text class="t-muted"   x="340" y="208" font-size="8"  text-anchor="middle">extractor / guard / filter / hoop</text>
  <text class="t-dim"     x="340" y="232" font-size="8"  text-anchor="middle">resolved at wiring (Arc clone)</text>

  <!-- stage 3 -->
  <rect class="c-mask"  x="452" y="140" width="176" height="124" rx="10"/>
  <rect class="c-cloud" x="452" y="140" width="176" height="124" rx="10"/>
  <text class="t-primary" x="540" y="182" font-size="12" text-anchor="middle">handler encode/decode</text>
  <text class="t-muted"   x="540" y="208" font-size="9"  text-anchor="middle">guard.encode(&amp;[1, 2, 3])</text>
  <text class="t-dim"     x="540" y="232" font-size="8"  text-anchor="middle">guard.decode(hash)</text>

  <!-- stage 4 -->
  <rect class="c-mask"     x="652" y="140" width="176" height="124" rx="10"/>
  <rect class="c-database" x="652" y="140" width="176" height="124" rx="10"/>
  <text class="t-primary" x="740" y="182" font-size="12" text-anchor="middle">Resolve connection</text>
  <text class="t-muted"   x="740" y="208" font-size="9"  text-anchor="middle">cache hit → Arc reuse</text>
  <text class="t-dim"     x="740" y="232" font-size="8"  text-anchor="middle">miss → make() builds</text>

  <!-- stage 5 -->
  <rect class="c-mask"     x="852" y="140" width="176" height="124" rx="10"/>
  <rect class="c-frontend" x="852" y="140" width="176" height="124" rx="10"/>
  <text class="t-primary" x="940" y="182" font-size="12" text-anchor="middle">Response</text>
  <text class="t-muted"   x="940" y="208" font-size="9"  text-anchor="middle">short ID / original number</text>
  <text class="t-dim"     x="940" y="232" font-size="8"  text-anchor="middle">returned to the caller</text>

  <!-- failure branch -->
  <line class="a-default" x1="340" y1="268" x2="340" y2="376" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ah)"/>
  <text class="t-dim" x="352" y="326" font-size="8">default connection unset</text>

  <rect class="c-mask"     x="52" y="380" width="976" height="114" rx="10"/>
  <rect class="c-security" x="52" y="380" width="976" height="114" rx="10"/>
  <text class="t-security" x="76" y="412" font-size="12">Failure path · default connection unset</text>
  <text class="t-muted"    x="76" y="440" font-size="9">Warp / e-cat / Guard: from_manager() errors at wiring — startup fails</text>
  <text class="t-muted"    x="76" y="461" font-size="9">Other frameworks: 500 at extraction — configuration errors never degrade silently</text>
  <text class="t-dim"      x="76" y="482" font-size="9">Invalid encode/decode input does not error: returns empty sentinels (PHP semantics)</text>

  <text class="t-dim" x="24" y="600" font-size="9">© 2026 erik · https://erik.xyz</text>
</svg>
